[package]
name = "adapters-ytdlp"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
domain = { path = "../domain" }
ports = { path = "../ports" }
async-trait.workspace = true
uuid = { workspace = true, features = ["v4"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "fs", "macros", "rt"] }
thiserror.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
