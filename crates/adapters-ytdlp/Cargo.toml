[package]
name = "adapters-ytdlp"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
native-e2e = []

[dependencies]
domain.workspace = true
ports.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["v4"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "fs", "macros", "rt"] }
thiserror.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
windows = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
