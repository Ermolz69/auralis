[package]
name = "adapters-translate"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
auralis-translation = { path = "../../modules/auralis-translate/crates/auralis-translation" }
auralis-translation-formats = { path = "../../modules/auralis-translate/crates/auralis-translation-formats" }
auralis-translation-llamacpp = { path = "../../modules/auralis-translate/crates/auralis-translation-llamacpp" }
auralis-translation-sqlite = { path = "../../modules/auralis-translate/crates/auralis-translation-sqlite" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ports.workspace = true
domain.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["process", "rt", "sync", "time"] }
chrono.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
windows = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = "0.39"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
