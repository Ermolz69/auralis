[package]
name = "adapters-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
common = { path = "../common" }
domain = { path = "../domain" }
ports = { path = "../ports" }
async-trait = "0.1.89"
chrono = "0.4.39"
uuid = { version = "1.12.1", features = ["v4"] }
tokio = { version = "1.43.0", features = ["fs"] }
sqlx = { workspace = true, features = ["derive"] }
sqlx-sqlite = { version = "0.9.0", default-features = false, features = ["chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tempfile = "3.16.0"
filetime = "0.2.29"

[lints]
workspace = true
