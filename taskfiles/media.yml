version: '3'

tasks:
  setup-tools:
    desc: Prepare pinned media tools for the current desktop target
    cmds:
      - task: prepare

  check:
    desc: Validate pinned versions, integrity metadata and build/release wiring without downloads
    cmds:
      - node --test tools/media-tools/media-tools.test.mjs
      - node tools/media-tools/cli.mjs check

  prepare:
    desc: Download, verify and stage pinned ffmpeg, ffprobe and yt-dlp binaries
    cmds:
      - node tools/media-tools/cli.mjs prepare

  verify:
    desc: Verify hashes, licenses, provenance and executable versions of staged media tools
    cmds:
      - node tools/media-tools/cli.mjs verify

  bundle:verify:
    desc: Extract the native installer and verify its bundled media tools
    cmds:
      - node tools/media-tools/cli.mjs verify-bundle

  doctor:
    desc: Verify the bundled media tools for the current desktop target
    cmds:
      - task: verify

  probe:
    desc: Probe a media file natively
    cmds:
      - cargo run -p adapters-ffmpeg --example probe -- "{{.CLI_ARGS}}"

  test:
    desc: Run tests for media adapters and usecases
    cmds:
      - task: check
      - cargo test -p adapters-ffmpeg
      - cargo test -p adapters-ytdlp
      - cargo test -p application -- usecases::project
