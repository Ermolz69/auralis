version: '3'

tasks:
  frontend:
    cmds:
      - task: fsd-boundaries
      - task: color-tokens
      - task: file-size
      - task: duplicate-code
      - task: desktop-policies

  desktop-policies:
    desc: Validate bundle budgets and desktop content security policy
    cmds:
      - node --test tools/scripts/check-bundle.test.mjs tools/scripts/check-csp.test.mjs
      - task: ipc-contract
      - task: release-metadata
      - task: :release:smoke:check

  docs:
    cmds:
      - pnpm prettier --check "**/*.md"

  global:
    cmds:
      - task: :media:check
      - task: ipc-contract
      - task: release-metadata
      - task: workspace-dependencies
      - task: :sec:sqlite:verify
      - task: :sec:glib:verify
      - task: format-check
      - task: runtime-println
      - task: storage-fallbacks
      - task: ci-bootstrap

  ci-bootstrap:
    desc: Validate shared CI and release environment contracts
    cmds:
      - node --test tools/scripts/check-ci-bootstrap.test.mjs tools/scripts/check-install-tasks.test.mjs tools/scripts/check-security.test.mjs

  runtime-println:
    cmds:
      - node tools/scripts/check-runtime-println.test.mjs
      - node tools/scripts/check-runtime-println.mjs

  storage-fallbacks:
    cmds:
      - node tools/scripts/check-storage-fallbacks.test.mjs
      - node tools/scripts/check-storage-fallbacks.mjs

  fsd-boundaries:
    cmds:
      - pnpm --filter desktop exec node --test eslint.config.test.mjs
      - pnpm --filter desktop fsd-boundaries
      - node tools/scripts/check-fsd-imports.mjs

  file-size:
    cmds:
      - node tools/scripts/check-file-size.test.mjs
      - node tools/scripts/check-file-size.mjs

  duplicate-code:
    desc: Reject large exact copy-paste blocks in frontend production code
    cmds:
      - node --test tools/scripts/check-duplicate-code.test.mjs
      - node tools/scripts/check-duplicate-code.mjs

  ipc-contract:
    desc: Keep registered Rust commands and events in parity with TypeScript IPC maps
    cmds:
      - node --test tools/scripts/check-ipc-contract.test.mjs
      - node tools/scripts/check-ipc-contract.mjs

  release-metadata:
    desc: Keep Rust, frontend and Tauri release identity synchronized
    cmds:
      - node --test tools/scripts/check-release-metadata.test.mjs
      - node tools/scripts/check-release-metadata.mjs

  workspace-dependencies:
    desc: Keep shared Cargo dependency versions centralized at the workspace root
    cmds:
      - node --test tools/scripts/check-workspace-dependencies.test.mjs
      - node tools/scripts/check-workspace-dependencies.mjs

  color-tokens:
    cmds:
      - node tools/scripts/check-raw-colors.mjs

  format-check:
    cmds:
      - pnpm prettier --check "**/*.{ts,tsx,css,json,yaml,yml,md}"

  format-write:
    vars:
      FORMAT_TARGETS: '{{default "\"**/*.{ts,tsx,css,json,yaml,yml,md}\"" .CLI_ARGS}}'
    cmds:
      - pnpm prettier --write {{.FORMAT_TARGETS}}
