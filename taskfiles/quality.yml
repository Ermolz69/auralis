version: '3'

tasks:
  frontend:
    cmds:
      - task: fsd-boundaries
      - task: color-tokens
      - task: file-size

  docs:
    cmds:
      - pnpm prettier --check "**/*.md"

  global:
    cmds:
      - task: format-check
      - task: runtime-println
      - task: storage-fallbacks
      - task: ci-bootstrap

  ci-bootstrap:
    desc: Validate shared CI and release environment contracts
    cmds:
      - node --test tools/scripts/check-ci-bootstrap.test.mjs tools/scripts/check-install-tasks.test.mjs tools/scripts/check-security.test.mjs

  runtime-println:
    cmds:
      - node tools/scripts/check-runtime-println.test.mjs
      - node tools/scripts/check-runtime-println.mjs

  storage-fallbacks:
    cmds:
      - node tools/scripts/check-storage-fallbacks.test.mjs
      - node tools/scripts/check-storage-fallbacks.mjs

  fsd-boundaries:
    cmds:
      - pnpm --filter desktop exec node --test eslint.config.test.mjs
      - pnpm --filter desktop fsd-boundaries
      - node tools/scripts/check-fsd-imports.mjs

  file-size:
    cmds:
      - node tools/scripts/check-file-size.test.mjs
      - node tools/scripts/check-file-size.mjs

  color-tokens:
    cmds:
      - node tools/scripts/check-raw-colors.mjs

  format-check:
    cmds:
      - pnpm prettier --check "**/*.{ts,tsx,css,json,yaml,yml,md}"

  format-write:
    vars:
      FORMAT_TARGETS: '{{default "\"**/*.{ts,tsx,css,json,yaml,yml,md}\"" .CLI_ARGS}}'
    cmds:
      - pnpm prettier --write {{.FORMAT_TARGETS}}
