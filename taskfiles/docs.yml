version: '3'

tasks:
  all:
    cmds:
      - task: check
      - task: lint

  check:
    desc: Validate mandatory documents and local Markdown links
    cmds:
      - node --test tools/scripts/check-docs.test.mjs
      - node tools/scripts/check-docs.mjs

  lint:
    cmds:
      - pnpm markdownlint-cli2 "**/*.md" "#node_modules" "#target" "#dist"
