version: '3'

tasks:
  diagnose:project:
    desc: Inspect retained profile package hashes and pure CONTRACT imports without project actions or models
    requires:
      vars: [PROFILE]
    cmds:
      - node tools/ui-e2e/project-diagnostics.mjs "{{.PROFILE}}"
  assets:project:
    desc: Stage pinned Python and CONTRACT metadata without engine dependencies, models or voices
    requires:
      vars: [SEED, INPUT_ROOT, INPUT_SEED, MANIFEST_SHA, PYTHON, CONTRACT_ROOT]
    cmds:
      - node tools/ui-e2e/project-seed.mjs "{{.SEED}}" "{{.INPUT_ROOT}}" "{{.INPUT_SEED}}" "{{.MANIFEST_SHA}}" "{{.PYTHON}}" "{{.CONTRACT_ROOT}}"
  freeze:project:
    desc: Freeze a native media-project smoke case that prohibits model execution
    requires:
      vars: [CASE, SEED]
    cmds:
      - node tools/ui-e2e/freeze-project.mjs "{{.CASE}}" "{{.SEED}}"
  check:pcm:
    desc: Check pinned read-only DSP with synthetic PCM, without engines or models
    requires:
      vars: [SEED, COMPONENTS]
    vars:
      INPUT_ROOT: '{{default "." .INPUT_ROOT}}'
    cmds:
      - node tools/ui-e2e/pcm-check.mjs "{{.SEED}}" "{{.COMPONENTS}}" "{{.INPUT_ROOT}}"
  check:processes:
    desc: Verify owned process abort and confirmed release using an inert Node child without components or models
    cmds:
      - node --test tools/ui-e2e/installer.native.test.mjs
  components:probe:
    desc: Verify installed CONTRACT and exact neutral-reference permissions without importing model engines or changing voices
    requires:
      vars: [ID, SEED, COMPONENTS]
    cmds:
      - node tools/ui-e2e/component-probe.mjs "{{.ID}}" "{{.SEED}}" "{{.COMPONENTS}}"
  components:build:
    desc: Build CONTRACT and retain the pinned streamed TTS wheel without model loading or voice changes
    requires:
      vars: [ID]
    cmds:
      - powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/ui-e2e/build-components.ps1 -Id "{{.ID}}"
  check:video:
    desc: Verify video policy, durable assembly publication and profile schema without models
    cmds:
      - 'cargo test --locked -p adapters-ffmpeg --lib assembly::video::'
      - 'cargo test --locked -p adapters-ffmpeg --lib assembly::process::'
      - cargo test --locked -p application --test audio_assembly
      - cargo test --locked -p adapters-storage --test audio_assembly
      - cargo test --locked -p adapters-storage --lib
  check:technical:
    desc: Verify explicit unverified-neutral permission without loading models
    cmds:
      - task: :rs:test:speech-workflow
      - cargo test --locked -p application --test puza_contract
      - pnpm --filter desktop exec vitest run --project component src/features/speech-catalog/ui/SpeechCatalog.test.tsx src/features/speech-catalog/ui/SpeechWorkflow.test.tsx
      - task: :fe:typecheck
  fmt:technical:
    cmds:
      - cargo fmt --all
      - pnpm prettier --write "apps/desktop/src/features/speech-catalog/model/*.ts" "apps/desktop/src/features/speech-catalog/ui/SpeechCatalog*.tsx" apps/desktop/src/features/speech-catalog/ui/SpeechVoiceSettings.tsx apps/desktop/src/shared/api/contracts/speech.ts
      - pnpm prettier --write apps/desktop/src/features/speech-catalog/ui/SpeechSourcePreview.tsx apps/desktop/src/features/speech-catalog/ui/SpeechWorkflow.tsx apps/desktop/src/features/speech-catalog/ui/SpeechRunControls.tsx
      - pnpm prettier --write "apps/desktop/src/features/speech-catalog/model/audio-assembly/*.ts" "apps/desktop/src/features/speech-catalog/ui/audio-assembly/*.tsx" "apps/desktop/src/shared/api/contracts/audioAssembly*.ts" docs/integration/revoice-video-export.md
  check:frontend:
    cmds:
      - task: :fe:typecheck
      - pnpm --filter desktop exec vitest run --project unit src/shared/api/contracts/audioAssemblyValidation.test.ts
      - pnpm --filter desktop exec vitest run --project component src/features/speech-catalog/ui/SpeechCatalog.test.tsx src/features/speech-catalog/ui/SpeechWorkflow.test.tsx src/features/speech-catalog/ui/audio-assembly/AudioAssemblyPanel.test.tsx src/features/translation-run-control/ui/TranslationRunControl.test.tsx src/pages/project/ui/SubtitleWorkspace.test.tsx
  assets:
    desc: Copy verified installed components and pinned translator assets into a new owned UI seed without model loading
    requires:
      vars: [SEED]
    cmds:
      - node tools/ui-e2e/assets.mjs "{{.SEED}}"
  assets:resume:
    desc: Verify existing copied bytes and continue an interrupted component seed without overwriting files
    requires:
      vars: [SEED]
    cmds:
      - node tools/ui-e2e/assets.mjs "{{.SEED}}" resume
  check:
    desc: Check UI runner isolation, reports, budgets and executable identities without models
    cmds:
      - task: check:runner
      - 'cargo test --locked -p auralis-app --lib profile::'
  check:runner:
    cmds:
      - node tools/ui-e2e/syntax.mjs
      - node --test tools/ui-e2e/core.test.mjs tools/ui-e2e/integrity.test.mjs tools/ui-e2e/seed.test.mjs tools/ui-e2e/speech-evidence.test.mjs tools/ui-e2e/observe.test.mjs tools/ui-e2e/cues.test.mjs tools/ui-e2e/chunks.test.mjs tools/ui-e2e/lineage.test.mjs tools/ui-e2e/resources.test.mjs tools/ui-e2e/selections.test.mjs tools/ui-e2e/build-identity.test.mjs tools/ui-e2e/layout.test.mjs tools/ui-e2e/installer.test.mjs tools/ui-e2e/failures.test.mjs tools/ui-e2e/lineage-translation.test.mjs tools/ui-e2e/pcm.test.mjs
  fmt:runner:
    cmds:
      - pnpm prettier --write "tools/ui-e2e/*.mjs" "apps/desktop/scripts/ui-*.mjs" taskfiles/ui.yml docs/integration/ui-automation.md
      - pnpm prettier --write apps/desktop/scripts/e2e.test.mjs apps/desktop/scripts/e2e-fixture.mjs apps/desktop/scripts/run-e2e.mjs
      - pnpm prettier --write apps/desktop/src/pages/project/ui/subtitle-workspace/SubtitleActivityLog.tsx
      - pnpm prettier --write apps/desktop/src/features/speech-catalog/ui/SpeechMediaPlayer.tsx apps/desktop/src/features/speech-catalog/ui/SpeechRunControls.tsx apps/desktop/src/features/speech-catalog/ui/audio-assembly/AudioAssemblyPanel.tsx
  regression:
    cmds:
      - task: :fe:test:unit
      - pnpm --filter desktop exec vitest run --project component src/features/paste-youtube-link/model/usePasteYoutubeLink.test.tsx src/features/paste-youtube-link/ui/PasteYoutubeLink.test.tsx src/features/import-local-media/model/useImportLocalMedia.test.tsx src/features/import-local-media/ui/ImportLocalMediaButton.test.tsx src/features/speech-catalog/ui/SpeechCatalog.test.tsx
  fmt:
    cmds:
      - cargo fmt --all
      - pnpm prettier --write "tools/ui-e2e/*.mjs" "apps/desktop/scripts/ui-*.mjs" taskfiles/ui.yml docs/integration/ui-automation.md
      - pnpm prettier --write apps/desktop/src/features/speech-catalog/ui/SpeechVoiceSettings.tsx
      - pnpm prettier --write apps/desktop/src/pages/home/ui/HomePage.tsx apps/desktop/src/features/paste-youtube-link/model/usePasteYoutubeLink.ts apps/desktop/src/features/paste-youtube-link/ui/PasteYoutubeLink.tsx apps/desktop/src/features/import-local-media/model/useImportLocalMedia.ts apps/desktop/src/features/import-local-media/ui/ImportLocalMediaButton.tsx
      - pnpm prettier --write apps/desktop/src/features/paste-youtube-link/model/usePasteYoutubeLink.test.tsx apps/desktop/src/features/import-local-media/model/useImportLocalMedia.test.tsx
  fixture:run:
    cmds:
      - node apps/desktop/scripts/ui-fixture.mjs
      - node apps/desktop/scripts/ui-diagnostic-fixture.mjs
  lint:
    cmds:
      - cargo clippy --locked -p auralis-app --all-targets -- -D warnings
      - task: :fe:lint
      - task: :q:frontend
      - task: :q:file-size
  build:
    desc: Build the ordinary release application and retain a standalone candidate with verified media tools
    env:
      AURALIS_NATIVE_E2E: '0'
      VITE_NATIVE_E2E: '0'
    cmds:
      - node tools/ui-e2e/candidate.mjs begin
      - pnpm tauri build --no-bundle
      - node tools/ui-e2e/candidate.mjs
  fixture:
    desc: Exercise the production interface with explicitly simulated IPC and retain a new report
    cmds:
      - task: :fe:build
      - node apps/desktop/scripts/ui-fixture.mjs
      - node apps/desktop/scripts/ui-diagnostic-fixture.mjs
  smoke:
    desc: Run ordinary packaged Windows Auralis through WebView2 without models
    vars:
      SPEC: '{{default "" .SPEC}}'
    cmds:
      - node tools/ui-e2e/run.mjs smoke "{{.SPEC}}"
  real:
    desc: Run the frozen real UI scenario once with isolated data and sequential component ownership
    requires:
      vars: [SPEC]
    cmds:
      - node tools/ui-e2e/run.mjs real "{{.SPEC}}"
  freeze:
    desc: Freeze a new candidate-pinned readiness case without authorizing inference
    requires:
      vars: [CASE]
    cmds:
      - node tools/ui-e2e/freeze.mjs "{{.CASE}}"
  freeze:connected:
    desc: Freeze exact installed-component inputs for a model-free smoke or a later sequential real UI case
    requires:
      vars: [CASE, SEED, COMPONENTS]
    vars:
      MODE: '{{default "smoke" .MODE}}'
      SCOPE: '{{default "full-source" .SCOPE}}'
    cmds:
      - node tools/ui-e2e/freeze-connected.mjs "{{.CASE}}" "{{.SEED}}" "{{.COMPONENTS}}" "{{.MODE}}" "{{.SCOPE}}"
  report:
    desc: Read the portable report for an existing UI run
    requires:
      vars: [RUN]
    cmds:
      - node tools/ui-e2e/report.mjs "{{.RUN}}"
