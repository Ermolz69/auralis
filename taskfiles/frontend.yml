version: '3'

tasks:
  storybook:library:
    cmds:
      - pnpm --filter desktop test:storybook src/app/studio/ui/StudioShell.stories.tsx
  test:library:
    cmds:
      - pnpm --filter desktop test:unit src/entities/library src/app/studio src/shared/api/contracts/libraryValidation.test.ts
      - pnpm --filter desktop test:components src/features/speech-catalog/ui/SpeechWorkflow.test.tsx src/features/speech-catalog/ui/SpeechCatalog.test.tsx
      - pnpm --filter desktop test:integration src/App.selection.test.tsx
  smoke:library:
    env:
      AURALIS_LIBRARY_EVIDENCE: '{{.EVIDENCE}}'
    requires:
      vars: [EVIDENCE]
    cmds:
      - pnpm --filter desktop exec node --test scripts/production-library.test.mjs
  fmt:library:
    cmds:
      - pnpm prettier --write "apps/desktop/scripts/production-fixture.mjs"
      - pnpm prettier --write "tools/tts/inspect_library.mjs" "Taskfile.yml"
      - pnpm prettier --write "apps/desktop/src/App.tsx" "apps/desktop/src/App.selection.test.tsx" "apps/desktop/src/entities/library/**/*.{ts,tsx}" "apps/desktop/src/widgets/library-browser/**/*.{ts,tsx}" "apps/desktop/src/app/studio/**/*.{ts,tsx}" "apps/desktop/src/shared/api/contracts/{library.ts,libraryValidation.ts,libraryValidation.test.ts,commandMap.ts,runtimeValidation.ts}" "apps/desktop/src/features/speech-catalog/**/*.{ts,tsx}" "apps/desktop/src/widgets/app-shell/index.ts" "apps/desktop/src/pages/project/index.ts" "apps/desktop/scripts/*library*.mjs" "taskfiles/{frontend,rust}.yml"
  theme:generate:
    cmds:
      - node tools/theme/generate.mjs
  theme:check:
    cmds:
      - node tools/theme/generate.mjs --check
  theme:smoke:
    env:
      AURALIS_THEME_EVIDENCE: '{{.EVIDENCE}}'
    requires:
      vars: [EVIDENCE]
    cmds:
      - pnpm --filter desktop exec node --test scripts/production-tessera-theme.test.mjs
  fmt:themes:
    cmds:
      - pnpm prettier --write "apps/desktop/src/app/styles/fonts.css" "taskfiles/frontend.yml" "taskfiles/rust.yml"
      - pnpm prettier --write "apps/desktop/scripts/production-fixture.mjs" "apps/desktop/src/pages/project/ui/ProjectPage.stories.tsx"
      - pnpm prettier --write "apps/desktop/scripts/production-tessera-theme.test.mjs" "apps/desktop/src/pages/settings/ui/settings.data.ts"
      - pnpm prettier --write "tools/theme/*.mjs" "apps/desktop/src/shared/theme/**/*.{ts,tsx,json}" "apps/desktop/.storybook/*.{ts,tsx}" "apps/desktop/src/app/providers/{themePersistence.ts,NativeThemeProvider.test.tsx,SettingsPage.test.tsx}" "apps/desktop/src/app/styles/{index.css,theme.css}" "apps/desktop/src/shared/ui/select/Select.{stories.tsx,test.tsx}" "apps/desktop/visual-tests/storybook.visual.spec.mjs"
  test:themes:
    cmds:
      - pnpm --filter desktop test:components src/app/providers/NativeThemeProvider.test.tsx src/app/providers/SettingsPage.test.tsx
  fmt:speech:
    desc: Format speech UI and its native acceptance harness
    cmds:
      - pnpm prettier --write "apps/desktop/scripts/production-puza-speech.test.mjs" "apps/desktop/src/widgets/app-shell/ui/AppShell.test.tsx"
      - pnpm prettier --write "apps/desktop/src/pages/project/ui/SubtitleWorkspace.tsx" "apps/desktop/src/widgets/app-shell/ui/app-shell/ProjectListPanel.tsx" "apps/desktop/src/widgets/app-shell/ui/app-shell/PipelinePanel.tsx" "apps/desktop/src/widgets/project-header/ui/ProjectHeader.tsx" "apps/desktop/src/shared/api/contracts/error.ts" "apps/desktop/src/features/voice-catalog/ui/useVoiceCatalog.ts"
      - pnpm prettier --write "apps/desktop/src/main.tsx"
      - pnpm prettier --write "apps/desktop/src/features/speech-catalog/model/*.ts" "tools/tts/*.mjs"
      - pnpm prettier --write "apps/desktop/src/features/speech-catalog/ui/*.{ts,tsx}" "apps/desktop/src/shared/api/contracts/speech*.ts" "apps/desktop/src/shared/api/contracts/artifact.ts" "apps/desktop/src/shared/api/contracts/commandMap.ts" "apps/desktop/src/shared/api/contracts/runtimeValidation.ts" "apps/desktop/src/app/native-e2e/speechScenario.ts" "apps/desktop/src/app/native-e2e/NativeE2ERunner.tsx" "apps/desktop/src/vite-env.d.ts" "apps/desktop/vite.config.ts" "tools/native-e2e/speech.mjs" "tools/native-e2e/run.mjs"
  fmt:caster:
    desc: Format only the Caster catalog component and its interaction test
    cmds:
      - pnpm prettier --write "apps/desktop/src/features/voice-catalog/ui/VoiceCatalog.tsx" "apps/desktop/src/features/voice-catalog/ui/VoiceCatalog.test.tsx" "apps/desktop/src/app/native-e2e/casterScenario.ts" "tools/native-e2e/caster.mjs"
      - pnpm prettier --check "apps/desktop/src/app/native-e2e/NativeE2ERunner.tsx" "apps/desktop/src/vite-env.d.ts" "apps/desktop/vite.config.ts" "tools/native-e2e/run.mjs"

  dev:
    cmds:
      - pnpm --filter desktop dev

  all:
    cmds:
      - task: typecheck
      - task: lint
      - task: test
      - task: build
      - task: e2e:run
      - task: smoke

  install:
    cmds:
      - pnpm install --frozen-lockfile

  install-update:
    desc: Install dependencies and refresh the lockfile after manifest changes
    cmds:
      - pnpm install --no-frozen-lockfile

  setup:playwright:
    cmds:
      - pnpm --filter desktop exec playwright install chromium

  setup:playwright:ci:
    desc: Install Chromium and required system libraries for browser tests
    cmds:
      - pnpm --filter desktop exec playwright install --with-deps chromium

  lint:
    cmds:
      - pnpm --filter desktop lint

  typecheck:
    cmds:
      - pnpm --filter desktop typecheck

  test:
    desc: Run unit, component, integration, and Storybook browser tests with coverage thresholds
    cmds:
      - pnpm --filter desktop test {{.CLI_ARGS}}

  test:unit:
    desc: Run fast logic and API contract tests
    cmds:
      - pnpm --filter desktop test:unit {{.CLI_ARGS}}

  test:components:
    desc: Run React component and hook tests in jsdom
    cmds:
      - pnpm --filter desktop test:components {{.CLI_ARGS}}

  test:integration:
    desc: Run cross-provider frontend integration tests
    cmds:
      - pnpm --filter desktop test:integration {{.CLI_ARGS}}

  test:jobs:
    desc: Run job status synchronization, cancellation, and queue regressions
    cmds:
      - pnpm --filter desktop exec vitest run --project unit --project component --project integration src/entities/job src/features/cancel-job src/widgets/job-queue-panel/ui/JobQueuePanel.test.tsx src/widgets/app-shell/model/pipelineStatus.test.ts --reporter=default --reporter=hanging-process

  e2e:
    desc: Build and run the production browser end-to-end suite
    cmds:
      - task: build
      - task: e2e:run

  e2e:run:
    internal: true
    cmds:
      - pnpm --filter desktop e2e {{.CLI_ARGS}}

  build:
    cmds:
      - pnpm --filter desktop build
      - task: bundle:check

  bundle:check:
    desc: Enforce production bundle budgets and print the largest modules
    cmds:
      - node tools/scripts/check-bundle.mjs
      - node tools/translation-delivery/check.mjs

  smoke:
    desc: Test the production build under CSP in Chromium with a mocked IPC boundary
    cmds:
      - pnpm --filter desktop exec node --test scripts/production-smoke.test.mjs
  smoke:puza:
    desc: Verify the production speech panel under CSP with a fixture IPC boundary
    env:
      AURALIS_PUZA_SCREENSHOT: '{{.SCREENSHOT}}'
    requires:
      vars: [SCREENSHOT]
    cmds:
      - pnpm --filter desktop exec node --test scripts/production-puza-speech.test.mjs

  storybook:
    desc: Build the production-static design-system catalog
    cmds:
      - pnpm --filter desktop build-storybook

  storybook:test:
    desc: Run Storybook interactions and accessibility checks in Chromium
    cmds:
      - pnpm --filter desktop test:storybook

  storybook:visual:
    desc: Compare Storybook states with the committed Windows visual baselines
    cmds:
      - pnpm --filter desktop storybook:visual {{.CLI_ARGS}}

  storybook:visual:update:
    desc: Review and update Storybook visual baselines on Windows
    cmds:
      - pnpm --filter desktop storybook:visual:update {{.CLI_ARGS}}

  storybook:dev:
    desc: Start the interactive Auralis design-system catalog
    cmds:
      - pnpm --filter desktop storybook

  storybook:check:
    desc: Validate metadata, interactions, accessibility, visuals, and the static catalog
    cmds:
      - task: :q:storybook-contract
      - pnpm --filter desktop test:storybook
      - task: storybook:visual

  storybook-pages:
    cmds:
      - pnpm --filter desktop build-storybook:pages
