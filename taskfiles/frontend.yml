version: '3'

tasks:
  dev:
    cmds:
      - pnpm --filter desktop dev

  all:
    cmds:
      - task: typecheck
      - task: lint
      - task: test
      - task: build
      - task: e2e:run
      - task: smoke

  install:
    cmds:
      - pnpm install --frozen-lockfile

  install-update:
    desc: Install dependencies and refresh the lockfile after manifest changes
    cmds:
      - pnpm install --no-frozen-lockfile

  setup:playwright:
    cmds:
      - pnpm --filter desktop exec playwright install chromium

  setup:playwright:ci:
    desc: Install Chromium and required system libraries for browser tests
    cmds:
      - pnpm --filter desktop exec playwright install --with-deps chromium

  lint:
    cmds:
      - pnpm --filter desktop lint

  typecheck:
    cmds:
      - pnpm --filter desktop typecheck

  test:
    desc: Run unit, component, integration, and Storybook browser tests with coverage thresholds
    cmds:
      - pnpm --filter desktop test {{.CLI_ARGS}}

  test:unit:
    desc: Run fast logic and API contract tests
    cmds:
      - pnpm --filter desktop test:unit {{.CLI_ARGS}}

  test:components:
    desc: Run React component and hook tests in jsdom
    cmds:
      - pnpm --filter desktop test:components {{.CLI_ARGS}}

  test:integration:
    desc: Run cross-provider frontend integration tests
    cmds:
      - pnpm --filter desktop test:integration {{.CLI_ARGS}}

  test:jobs:
    desc: Run job status synchronization, cancellation, and queue regressions
    cmds:
      - pnpm --filter desktop exec vitest run --project unit --project component --project integration src/entities/job src/features/cancel-job src/widgets/job-queue-panel/ui/JobQueuePanel.test.tsx src/widgets/app-shell/model/pipelineStatus.test.ts --reporter=default --reporter=hanging-process

  e2e:
    desc: Build and run the production browser end-to-end suite
    cmds:
      - task: build
      - task: e2e:run

  e2e:run:
    internal: true
    cmds:
      - pnpm --filter desktop e2e {{.CLI_ARGS}}

  build:
    cmds:
      - pnpm --filter desktop build
      - task: bundle:check

  bundle:check:
    desc: Enforce production bundle budgets and print the largest modules
    cmds:
      - node tools/scripts/check-bundle.mjs

  smoke:
    desc: Test the production build under CSP in Chromium with a mocked IPC boundary
    cmds:
      - pnpm --filter desktop exec node --test scripts/production-smoke.test.mjs

  storybook:
    desc: Build the production-static design-system catalog
    cmds:
      - pnpm --filter desktop build-storybook

  storybook:test:
    desc: Run Storybook interactions and accessibility checks in Chromium
    cmds:
      - pnpm --filter desktop test:storybook

  storybook:visual:
    desc: Compare Storybook states with the committed Windows visual baselines
    cmds:
      - pnpm --filter desktop storybook:visual {{.CLI_ARGS}}

  storybook:visual:update:
    desc: Review and update Storybook visual baselines on Windows
    cmds:
      - pnpm --filter desktop storybook:visual:update {{.CLI_ARGS}}

  storybook:dev:
    desc: Start the interactive Auralis design-system catalog
    cmds:
      - pnpm --filter desktop storybook

  storybook:check:
    desc: Validate metadata, interactions, accessibility, visuals, and the static catalog
    cmds:
      - task: :q:storybook-contract
      - pnpm --filter desktop test:storybook
      - task: storybook:visual

  storybook-pages:
    cmds:
      - pnpm --filter desktop build-storybook:pages
