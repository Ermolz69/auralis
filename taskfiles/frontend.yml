version: '3'

tasks:
  all:
    cmds:
      - task: typecheck
      - task: lint
      - task: test
      - task: build

  install:
    cmds:
      - pnpm install --frozen-lockfile

  setup:playwright:
    cmds:
      - pnpm --filter desktop exec playwright install

  lint:
    cmds:
      - pnpm --filter desktop lint

  typecheck:
    cmds:
      - pnpm --filter desktop typecheck

  test:
    cmds:
      - pnpm --filter desktop test

  build:
    cmds:
      - pnpm --filter desktop build

  storybook:
    cmds:
      - pnpm --filter desktop build-storybook

  storybook-pages:
    cmds:
      - pnpm --filter desktop build-storybook:pages
