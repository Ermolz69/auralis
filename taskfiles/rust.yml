version: '3'

tasks:
  test:component-cleanup:
    desc: Verify bounded component and managed translator cleanup without native processes or models
    cmds:
      - cargo test --locked -p adapters-tts --lib owned_process::tests -- --test-threads=1
      - cargo test --locked -p adapters-translate --lib managed_runtime::owned_process::windows::tests -- --test-threads=1
  clippy:component-cleanup:
    desc: Lint translator and TTS component cleanup and synthetic exit controls
    cmds:
      - cargo clippy --locked -p adapters-tts --lib --tests -- -D warnings
      - cargo clippy --locked -p adapters-translate --lib --tests -- -D warnings
  test:tts:cleanup:
    desc: Verify forced TTS cleanup bounds and unconfirmed exit errors with synthetic children
    cmds:
      - cargo test --locked -p adapters-tts --lib execute::cleanup_tests -- --test-threads=1
  clippy:speech-budget:
    desc: Lint bounded speech budgets, owned fixture deadlines and native config without model execution
    cmds:
      - cargo clippy --locked -p ports --test speech_budget -- -D warnings
      - cargo clippy --locked -p adapters-tts --lib --tests -- -D warnings
      - cargo clippy --locked -p auralis-app --lib --tests -- -D warnings
  test:speech-budget:
    desc: Verify bounded legacy-compatible TTS budgets, native worker deadlines and bootstrap config without models
    cmds:
      - cargo test --locked -p ports --test speech_budget
      - cargo test --locked -p adapters-tts --lib execute::tests -- --test-threads=1
      - cargo test --locked -p auralis-app --lib bootstrap::tts::tests
