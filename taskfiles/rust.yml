version: '3'

tasks:
  test:puza:
    cmds:
      - cargo test --locked -p adapters-tts marker_tests
      - cargo test --locked -p application --test puza_contract
      - task: test:speech-workflow
  test:puza:installed:
    env:
      AURALIS_TEST_PUZA_RUNTIME: '{{.RUNTIME}}'
    requires:
      vars: [RUNTIME]
    cmds:
      - cargo test --locked -p adapters-tts --test installed_contract -- --ignored --test-threads=1
  test:marker:installed:
    env:
      AURALIS_TEST_MARKER_RUNTIME: '{{.RUNTIME}}'
      AURALIS_TEST_MARKER_EVIDENCE: '{{.EVIDENCE}}'
    requires:
      vars: [RUNTIME, EVIDENCE]
    cmds:
      - cargo test --locked -p adapters-tts --test installed_marker -- --ignored --test-threads=1
  fmt:puza-tests:
    cmds:
      - rustfmt --edition 2024 crates/adapters-tts/src/marker_lock.rs crates/adapters-tts/src/marker_tests.rs crates/adapters-tts/tests/installed_marker.rs
      - rustfmt --edition 2024 crates/application/tests/puza_contract.rs crates/adapters-tts/tests/installed_contract.rs crates/application/src/usecases/speech/voices.rs
  fmt:puza:
    cmds:
      - rustfmt --edition 2024 --config skip_children=true crates/ports/src/puza_contract.rs crates/ports/src/marker.rs crates/ports/src/repository.rs crates/ports/src/lib.rs crates/ports/src/transaction/youtube_import.rs crates/ports/src/speech_workflow.rs crates/adapters-tts/src/contract.rs crates/adapters-tts/src/marker.rs crates/adapters-tts/src/lib.rs crates/adapters-storage/src/sqlite/project_contract.rs crates/adapters-storage/src/sqlite/project_repository.rs crates/adapters-storage/src/sqlite/mod.rs crates/adapters-storage/src/sqlite/connection/puza_project.rs crates/adapters-storage/src/sqlite/connection/validation.rs crates/adapters-storage/src/sqlite/youtube_import_journal/mapping.rs crates/adapters-storage/src/sqlite/unit_of_work/youtube_import.rs crates/application/src/usecases/project/contract.rs crates/application/src/usecases/project/create.rs crates/application/src/usecases/project/mod.rs crates/application/src/usecases/project/create_from_youtube/usecase.rs crates/application/src/usecases/project/create_from_youtube/preparation.rs crates/application/src/usecases/speech/marker.rs crates/application/src/usecases/speech/service.rs crates/application/src/usecases/speech/source.rs crates/application/src/usecases/speech/prepare.rs crates/application/src/usecases/speech/mod.rs crates/application/src/usecases/speech_catalog.rs src-tauri/src/bootstrap/mod.rs src-tauri/src/bootstrap/tts.rs src-tauri/src/bootstrap/usecases.rs src-tauri/src/commands/tts.rs src-tauri/src/lib.rs crates/application/src/usecases/project/youtube_commit_tests.rs
      - task: fmt:speech
  test:desktop-manifest:
    desc: Verify the desktop's installed-runtime receipt fixture without loading models
    cmds:
      - cargo test --locked -p auralis-app --test caster_manifest
  test:speech-workflow:
    cmds:
      - cargo test --locked -p application --test speech_workflow {{.CLI_ARGS}}
  clippy:speech:
    desc: Lint speech workflow, persistence and shared model admission
    cmds:
      - cargo clippy --locked -p common -p adapters-tts -p application -p adapters-storage -p adapters-translate -p jobs --lib -- -D warnings
  fmt:speech:
    desc: Format speech integration sources
    cmds:
      - rustfmt --edition 2024 --config skip_children=true crates/application/src/usecases/speech/progress.rs crates/application/src/usecases/speech/ownership.rs crates/adapters-storage/src/sqlite/connection/speech_workflow.rs
      - rustfmt --edition 2024 --config skip_children=true crates/application/src/usecases/artifact/resolve_path.rs src-tauri/src/commands/artifact.rs
      - rustfmt --edition 2024 --config skip_children=true crates/ports/src/artifact_finalization/metadata.rs crates/ports/src/transaction/artifact.rs crates/adapters-storage/src/sqlite/artifact_index/finalization.rs crates/adapters-storage/src/sqlite/unit_of_work/artifact_writes.rs crates/adapters-storage/src/sqlite/unit_of_work/tests/mod.rs crates/application/src/worker/outbox/payload_handler.rs crates/adapters-storage/src/sqlite/project_revision_migration_tests.rs crates/adapters-storage/src/sqlite/translation_host_jobs_migration_tests.rs crates/adapters-storage/src/sqlite/translation_links_migration_tests.rs crates/adapters-storage/src/sqlite/translation_publication_revisions_migration_tests.rs crates/adapters-storage/src/sqlite/translation_run_intents_migration_tests.rs crates/adapters-storage/src/sqlite/ui_preferences/tests.rs crates/adapters-storage/src/sqlite/youtube_import_journal/tests.rs crates/adapters-storage/tests/merge_schema_upgrade.rs crates/adapters-storage/tests/support/legacy_outbox.rs crates/adapters-storage/tests/translation_edit_intents.rs crates/adapters-storage/tests/translation_reviews.rs
      - rustfmt --edition 2024 crates/application/src/usecases/speech/service.rs crates/application/src/usecases/speech/error.rs crates/application/src/usecases/speech/digest.rs crates/adapters-tts/src/integrity_tests.rs
      - rustfmt --edition 2024 --config skip_children=true crates/ports/src/speech_workflow.rs crates/ports/src/lib.rs crates/common/src/model_admission.rs crates/common/src/lib.rs crates/domain/src/media/artifact.rs crates/application/src/usecases/mod.rs crates/application/src/usecases/speech/mod.rs crates/application/src/usecases/speech/source.rs crates/application/src/usecases/speech/prepare.rs crates/application/src/usecases/speech/run.rs crates/application/src/usecases/speech/state.rs crates/application/src/usecases/speech_catalog.rs crates/application/tests/speech_workflow.rs crates/adapters-tts/src/client.rs crates/adapters-tts/src/execute.rs crates/adapters-tts/src/workflow.rs crates/adapters-tts/src/integrity.rs crates/adapters-tts/src/catalog.rs crates/adapters-tts/src/lib.rs crates/adapters-tts/tests/installed_catalog.rs crates/adapters-storage/src/local/storage_key.rs crates/adapters-storage/src/sqlite/artifact_index/queries.rs crates/adapters-storage/src/sqlite/connection/validation.rs crates/adapters-storage/src/sqlite/connection_tests.rs crates/adapters-storage/src/sqlite/speech_run_migration_tests.rs crates/adapters-storage/src/sqlite/speech_run_repository.rs crates/adapters-storage/src/sqlite/speech_run_repository/workflow.rs crates/adapters-storage/tests/speech_publication.rs crates/adapters-translate/src/managed_runtime/lease.rs crates/adapters-translate/src/managed_runtime/runtime.rs crates/jobs/src/manager/manager.rs src-tauri/src/bootstrap/mod.rs src-tauri/src/bootstrap/services.rs src-tauri/src/bootstrap/storage.rs src-tauri/src/bootstrap/translation.rs src-tauri/src/bootstrap/tts.rs src-tauri/src/commands/tts.rs src-tauri/src/dto/artifact.rs src-tauri/src/lib.rs
  check:speech:
    desc: Check the local speech workflow and refresh workspace dependency edges
    cmds:
      - cargo check -p application -p adapters-tts -p adapters-storage -p adapters-translate
  check:speech:desktop:
    desc: Check the Windows speech commands
    cmds:
      - cargo check --locked -p auralis-app
  test:outbox:
    desc: Verify project CAS, outbox ordering, ownership and publication
    cmds:
      - cargo test --locked -p adapters-storage {{.CLI_ARGS}}
      - cargo test --locked -p application outbox {{.CLI_ARGS}}

  bench:outbox:
    desc: Compare real local artifact publication with one and two outbox executors
    cmds:
      - cargo test --locked -p application --test outbox_benchmark -- --ignored --nocapture

  clippy:outbox:
    desc: Lint the changed outbox libraries and worker
    cmds:
      - cargo clippy --locked -p domain -p ports -p adapters-storage -p application --lib -- -D warnings
      - cargo clippy --locked -p application --test outbox_parallel --test outbox_benchmark -- -D warnings

  fmt:outbox:
    desc: Format the Auralis Rust workspace after outbox changes
    cmds:
      - cargo fmt --all

  clippy:queue:
    desc: Check queue libraries and their integration tests independently of unrelated adapters
    cmds:
      - cargo clippy --locked -p jobs -p application -p adapters-storage -p adapters-ytdlp --lib -- -D warnings
      - cargo clippy --locked -p application --test job_queue --test job_queue_recovery --test job_queue_benchmark -- -D warnings
      - cargo clippy --locked -p adapters-ytdlp --tests -- -D warnings
  fmt:queue:
    desc: Format only queue implementation and integration sources without traversing unrelated modules
    cmds:
      - node tools/job-queue/format.mjs

  test:queue:
    desc: Verify durable dispatch, resource fairness, cleanup, recovery and the real application pipeline
    cmds:
      - cargo test --locked -p application --test job_queue {{.CLI_ARGS}}
      - cargo test --locked -p application --test job_queue_recovery {{.CLI_ARGS}}
      - cargo test --locked -p adapters-ytdlp queue_process {{.CLI_ARGS}}

  bench:queue:
    desc: Compare bounded sequential and parallel fixture execution without external services
    cmds:
      - cargo test --locked -p application --test job_queue_benchmark -- --ignored --nocapture

  fmt:tts:
    desc: Format only TTS integration Rust sources without touching concurrent work
    cmds:
      - rustfmt --edition 2024 crates/adapters-tts/src/lib.rs crates/adapters-tts/src/client.rs crates/adapters-tts/src/execute.rs crates/adapters-tts/src/framed.rs crates/adapters-tts/src/owned_process.rs crates/adapters-tts/src/preflight.rs crates/adapters-tts/src/protocol.rs crates/adapters-tts/src/result_verification.rs crates/adapters-tts/src/wav_verification.rs crates/adapters-tts/tests/protocol.rs crates/adapters-tts/tests/framed.rs crates/adapters-tts/tests/result_verification.rs crates/domain/src/job/kind.rs crates/domain/src/job/entity.rs crates/domain/src/job/entity/speech_progress.rs crates/domain/src/media/artifact.rs crates/domain/tests/speech_job.rs crates/adapters-storage/src/local/storage_key.rs crates/adapters-storage/src/sqlite/connection.rs crates/adapters-storage/src/sqlite/connection_tests.rs crates/adapters-storage/src/sqlite/speech_run_migration.rs crates/adapters-storage/src/sqlite/speech_run_migration_tests.rs crates/adapters-storage/src/sqlite/speech_run_repository.rs crates/adapters-storage/tests/speech_job_kind.rs crates/adapters-storage/tests/speech_runs.rs crates/ports/src/speech_run.rs src-tauri/src/dto/artifact.rs

  fmt:tts-catalog:
    desc: Format the isolated TTS catalog bridge
    cmds:
      - rustfmt --edition 2024 crates/ports/src/speech_catalog.rs crates/application/src/usecases/speech_catalog.rs crates/adapters-tts/src/catalog.rs crates/adapters-tts/src/client.rs crates/adapters-tts/tests/installed_catalog.rs src-tauri/src/bootstrap/tts.rs src-tauri/src/commands/tts.rs

  test:tts-catalog:installed:
    desc: Read selected Ciri and Geralt copies through the installed TTS worker without model loading
    requires:
      vars: [PYTHON, PACKAGE_ROOT, VOICE_STORE, PROFILE_ROOT, MODEL_CACHE, INTEGRITY_SHA256]
    env:
      AURALIS_TEST_TTS_PYTHON: '{{.PYTHON}}'
      AURALIS_TEST_TTS_PACKAGE_ROOT: '{{.PACKAGE_ROOT}}'
      AURALIS_TEST_TTS_VOICE_STORE: '{{.VOICE_STORE}}'
      AURALIS_TEST_TTS_PROFILE_ROOT: '{{.PROFILE_ROOT}}'
      AURALIS_TEST_TTS_MODEL_CACHE: '{{.MODEL_CACHE}}'
      AURALIS_TEST_TTS_INTEGRITY_SHA256: '{{.INTEGRITY_SHA256}}'
    cmds:
      - cargo test --locked -p adapters-tts --test installed_catalog -- --ignored --nocapture

  test:tts-catalog:
    desc: Check the TTS catalog port and adapter without loading models
    cmds:
      - cargo test --locked -p adapters-tts
      - cargo check --locked -p application

  test:tts:
    desc: Verify the model-free TTS worker transport adapter
    cmds:
      - cargo test --locked -p adapters-tts {{.CLI_ARGS}}
      - cargo test --locked -p domain --test speech_job {{.CLI_ARGS}}
      - cargo test --locked -p adapters-storage --test speech_job_kind {{.CLI_ARGS}}
      - cargo test --locked -p adapters-storage --test speech_runs {{.CLI_ARGS}}
      - cargo test --locked -p adapters-storage --test speech_publication {{.CLI_ARGS}}
      - cargo test --locked -p adapters-storage --lib sqlite::connection_tests {{.CLI_ARGS}}
      - cargo test --locked -p adapters-storage --lib sqlite::speech_run_migration_tests {{.CLI_ARGS}}
      - cargo test --locked -p application --test speech_workflow {{.CLI_ARGS}}

  fmt:caster:
    desc: Format only Caster integration Rust sources without touching other work
    cmds:
      - rustfmt --edition 2024 crates/ports/src/caster.rs crates/application/src/usecases/caster.rs crates/application/tests/caster_artifact.rs crates/application/tests/caster_installed.rs crates/adapters-caster/src/worker.rs src-tauri/src/bootstrap/caster.rs src-tauri/src/commands/caster.rs src-tauri/src/commands/caster_audio.rs src-tauri/src/dto/artifact.rs src-tauri/tests/caster_manifest.rs

  test:caster:
    desc: Verify typed Caster worker transport and project-scoped use cases without models
    cmds:
      - cargo test --locked -p adapters-caster {{.CLI_ARGS}}
      - cargo test --locked -p application caster {{.CLI_ARGS}}
      - cargo test --locked -p auralis-app --test caster_manifest {{.CLI_ARGS}}

  test:caster:installed:
    desc: Exercise the installed Caster worker through Auralis project use cases and restart reads
    requires:
      vars: [PYTHON, VOICE_STORE]
    env:
      AURALIS_TEST_CASTER_PYTHON: '{{.PYTHON}}'
      AURALIS_TEST_CASTER_VOICE_STORE: '{{.VOICE_STORE}}'
    cmds:
      - cargo test --locked -p application --test caster_installed -- --ignored --nocapture

  lock:refresh:
    desc: Refresh workspace dependency metadata using the offline package cache
    cmds:
      - cargo update --offline --workspace

  lock:refresh:online:
    desc: Resolve an explicitly introduced crate absent from the offline cache
    cmds:
      - cargo update --workspace

  test:translation-events:
    desc: Verify committed translation lifecycle events against real SQLite state
    cmds:
      - cargo test --locked -p adapters-tauri --test translation_job_events
  dependencies:verify:
    desc: Verify the actual resolved SQLx packages and SQLite-only feature set
    cmds:
      - node tools/scripts/check-sqlite-dependencies.mjs --resolved

  test:ports:
    desc: Run port contract and transaction validation regressions
    cmds:
      - cargo test --locked -p ports {{.CLI_ARGS}}

  test:storage:
    desc: Run SQLite storage regressions against the locked dependency graph
    cmds:
      - cargo test --locked -p adapters-storage {{.CLI_ARGS}}

  test:translate:
    desc: Run the embedded Translate format-adapter regressions
    cmds:
      - cargo test --locked -p adapters-translate {{.CLI_ARGS}}

  test:desktop:
    desc: Run Tauri composition and desktop command regressions
    cmds:
      - cargo test --locked -p auralis-app {{.CLI_ARGS}}

  test:translate:package:
    desc: Install, select, corrupt, and repair the pinned CPU package from a complete local asset cache
    requires:
      vars: [ASSET_DIR]
    env:
      AURALIS_TEST_PACKAGE_ASSET_DIR: '{{.ASSET_DIR}}'
    cmds:
      - cargo test --locked -p adapters-translate --test installed_packages installs_and_selects_a_real_cached_package -- --ignored

  resolve:translate:
    desc: Resolve the pinned Translate submodule against the Auralis Cargo workspace
    cmds:
      - cargo check --offline -p adapters-translate

  resolve:application:
    desc: Resolve application integration tests after adding pinned Translate dependencies
    cmds:
      - cargo check --offline -p application --tests

  test:application:
    desc: Run application usecase and worker regressions
    cmds:
      - cargo test --locked -p application {{.CLI_ARGS}}

  test:youtube:
    desc: Run YouTube import and crash recovery regressions
    cmds:
      - cargo test --locked -p application youtube_ {{.CLI_ARGS}}
      - cargo test --locked -p adapters-ytdlp owned_process {{.CLI_ARGS}}

  test:jobs:
    desc: Run job lifecycle, cancellation, cleanup, and persistence regressions
    cmds:
      - cargo test --locked -p domain job {{.CLI_ARGS}}
      - cargo test --locked -p ports cancellation {{.CLI_ARGS}}
      - cargo test --locked -p jobs {{.CLI_ARGS}}
      - cargo test --locked -p application usecases::pipeline {{.CLI_ARGS}}
      - cargo test --locked -p application test_cancellation_during_download {{.CLI_ARGS}}
      - cargo test --locked -p adapters-storage sqlite::unit_of_work {{.CLI_ARGS}}
      - cargo test --locked -p adapters-storage sqlite::recovery {{.CLI_ARGS}}
      - cargo test --locked -p adapters-tauri job_event_bridge {{.CLI_ARGS}}

  soak:jobs:
    desc: Run the long job lifecycle heap profiler (10 minutes by default)
    env:
      AURALIS_JOB_SOAK_SECONDS: '{{default "600" .DURATION_SECS}}'
      AURALIS_JOB_SOAK_MIN_ITERATIONS: '{{default "100000" .MIN_ITERATIONS}}'
      AURALIS_JOB_SOAK_REPORT: '{{default "target/job-soak/heap-profile.json" .REPORT}}'
    cmds:
      - cargo test --locked --release -p jobs --test job_heap_soak -- --ignored --nocapture

  exec:wsl:
    desc: Run explicit Cargo verification arguments in Ubuntu WSL with an isolated Linux target directory
    platforms: [windows]
    requires:
      vars: [CLI_ARGS]
    cmds:
      - wsl -d Ubuntu-24.04 -- env RUSTUP_TOOLCHAIN=1.95.0 RUSTFLAGS=-Dwarnings CARGO_TARGET_DIR=/tmp/auralis-glib-backport-target cargo {{.CLI_ARGS}}

  glib:wsl:
    desc: Run the patched and unpatched optimized GLib controls in Ubuntu WSL
    platforms: [windows]
    cmds:
      - wsl -d Ubuntu-24.04 -- env RUSTUP_TOOLCHAIN=1.95.0 RUSTFLAGS=-Dwarnings CARGO_TERM_COLOR=always CARGO_TARGET_DIR=/tmp/auralis-glib-backport-target node tools/glib-backport/reproduce.mjs

  setup:wsl:
    desc: Install Linux verification prerequisites in the local Ubuntu WSL distribution
    platforms: [windows]
    cmds:
      - wsl -d Ubuntu-24.04 -u root -- apt-get update
      - wsl -d Ubuntu-24.04 -u root -- apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rustup nodejs
      - wsl -d Ubuntu-24.04 -- rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

  glib:regression:
    desc: Exercise the actual patched GLib iterator with release optimizations on Linux
    platforms: [linux]
    cmds:
      - cargo test --locked --release -p glib-backport-regression

  glib:reproduce:
    desc: Confirm the upstream iterator fails the same optimized regression before the patch
    platforms: [linux]
    cmds:
      - node tools/glib-backport/reproduce.mjs

  build:release:
    desc: Build the native desktop executable with the production profile
    cmds:
      - cargo build --locked --release -p auralis-app

  tree:
    desc: Inspect the locked Rust dependency graph
    cmds:
      - cargo tree --locked {{.CLI_ARGS}}

  update:
    desc: Update selected Rust dependencies with explicit Cargo arguments
    preconditions:
      - sh: test -n '{{.CLI_ARGS}}'
        msg: Pass an explicit package and version with -- --package <crate> --precise <version>
    cmds:
      - cargo update {{.CLI_ARGS}}

  fetch:
    cmds:
      - cargo fetch --locked

  pr:
    desc: Run the Rust checks required on pull requests
    cmds:
      - task: dependencies:verify
      - task: fmt
      - task: clippy
      - task: test

  all:
    cmds:
      - task: pr
      - task: glib:regression

  fmt:
    cmds:
      - cargo fmt --all -- --check

  fmt-write:
    cmds:
      - cargo fmt --all

  clippy:
    cmds:
      - cargo clippy --locked --workspace --all-targets -- -D warnings

  clippy:native-e2e:
    desc: Check feature-gated native desktop test commands and observers with denied warnings
    cmds:
      - cargo clippy --locked -p auralis-app --all-targets --features native-e2e -- -D warnings

  test:
    cmds:
      - cargo test --locked --workspace

  check:
    cmds:
      - cargo check --locked --workspace
