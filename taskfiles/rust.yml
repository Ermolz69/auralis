    desc: Verify invalid input priority and valid-request exclusion under an owned native model-free lease
    cmds:
      - cargo test --locked -p adapters-translate --test managed_runtime_admission -- --include-ignored --test-threads=1
  test:contract-bridge:
    desc: Verify the shipped CONTRACT bridge with fixture API, long casts and qualification controls without models
    requires:
      vars: [PYTHON]
    env:
