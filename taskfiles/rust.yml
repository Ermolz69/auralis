version: '3'

tasks:
  tree:
    desc: Inspect the locked Rust dependency graph
    cmds:
      - cargo tree --locked {{.CLI_ARGS}}

  update:
    desc: Update selected Rust lockfile entries using explicit Cargo arguments
    requires:
      vars: [CLI_ARGS]
    cmds:
      - cargo update {{.CLI_ARGS}}

  fetch:
    cmds:
      - cargo fetch --locked

  all:
    cmds:
      - task: fmt
      - task: clippy
      - task: check
      - task: test

  fmt:
    cmds:
      - cargo fmt --all -- --check

  fmt-write:
    cmds:
      - cargo fmt --all

  clippy:
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  test:
    cmds:
      - cargo test --workspace

  check:
    cmds:
      - cargo check --workspace
