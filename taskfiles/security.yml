version: '3'

tasks:
  sqlite:verify:
    desc: Reject RSA and unused SQLx database packages anywhere in the lockfile
    cmds:
      - node --test tools/scripts/check-sqlite-dependencies.test.mjs
      - node tools/scripts/check-sqlite-dependencies.mjs

  rust:audit:
    desc: Compatibility alias for the Rust vulnerability audit
    cmds:
      - task: audit:rust

  glib:audit:
    desc: Compatibility alias for the complete Rust vulnerability audit
    cmds:
      - task: rust:audit

  glib:vendor:
    desc: Import the checksum-pinned upstream glib package without overwriting an existing copy
    cmds:
      - node tools/glib-backport/package.mjs import

  glib:verify:
    desc: Verify the complete vendored package against the upstream archive and exact safety patch
    cmds:
      - node --test tools/glib-backport/package.test.mjs
      - node tools/glib-backport/package.mjs verify

  all:
    cmds:
      - task: audit

  audit:
    cmds:
      - task: audit:npm
      - task: audit:rust
      - task: deny:rust

  setup:rust:
    desc: Install pinned Rust dependency security tools
    cmds:
      - cargo install cargo-audit --version 0.22.2 --locked
      - cargo install cargo-deny --version 0.20.2 --locked

  audit:npm:
    desc: Audit all npm dependencies, including development tooling
    cmds:
      - pnpm audit

  audit:rust:
    desc: Audit Cargo.lock against RustSec
    cmds:
      - cargo audit --file Cargo.lock --deny unsound

  deny:rust:
    desc: Check Rust advisories and allowed dependency sources
    cmds:
      - cargo deny --locked check advisories sources
