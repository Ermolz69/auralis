[package]
name = "auralis-app"
version.workspace = true
description = "Auralis Desktop App"
authors.workspace = true
edition.workspace = true

[features]
native-e2e = ["adapters-ytdlp/native-e2e"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
application.workspace = true
domain.workspace = true
ports.workspace = true
jobs.workspace = true
adapters-storage.workspace = true
adapters-ytdlp.workspace = true
adapters-model.workspace = true
adapters-ffmpeg.workspace = true
adapters-tauri.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-updater.workspace = true
async-trait.workspace = true
tauri-plugin-shell.workspace = true
chrono = { workspace = true, features = ["serde"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
tracing-appender.workspace = true
common.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
