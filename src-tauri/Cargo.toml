[package]
name = "auralis-app"
version.workspace = true
description = "Auralis Desktop App"
authors.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
application = { path = "../crates/application" }
domain = { path = "../crates/domain" }
ports = { path = "../crates/ports" }
jobs = { path = "../crates/jobs" }
adapters-storage = { path = "../crates/adapters-storage" }
adapters-ytdlp = { path = "../crates/adapters-ytdlp" }
adapters-model = { path = "../crates/adapters-model" }
adapters-ffmpeg = { path = "../crates/adapters-ffmpeg" }
adapters-tauri = { path = "../crates/adapters-tauri" }
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
async-trait.workspace = true
tauri-plugin-shell.workspace = true
chrono = { workspace = true, features = ["serde"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
common = { path = "../crates/common" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
