name: Storybook Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@${{ env.NODE_VERSION }}
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install dependencies
        run: task install

      - name: Build Storybook to Pages dir
        run: task frontend:storybook-pages

      - name: Create .nojekyll
        run: touch .pages/.nojekyll

      - name: Create index.html redirect
        run: |
          mkdir -p .pages
          echo '<meta http-equiv="refresh" content="0; url=/auralis/docs/storybook/" />' > .pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
