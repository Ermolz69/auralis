name: Storybook Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Storybook build
        uses: ./.github/actions/bootstrap
        with:
          node: 'true'

      - name: Build Storybook to Pages dir
        run: task frontend:storybook-pages

      - name: Create .nojekyll
        run: touch .pages/.nojekyll

      - name: Create index.html redirect
        run: |
          mkdir -p .pages
          echo '<meta http-equiv="refresh" content="0; url=/auralis/docs/storybook/" />' > .pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
