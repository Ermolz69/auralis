name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      quality: ${{ steps.filter.outputs.quality }}
      release: ${{ steps.filter.outputs.release }}
      ci: ${{ steps.filter.outputs.ci }}
      global: ${{ steps.filter.outputs.global }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Paths Filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/desktop/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.mjs'
              - '.eslintrc*'
              - 'prettier.config.mjs'
              - '.prettierrc*'
              - 'tailwind.config.*'
              - 'vite.config.*'
              - '.storybook/**'
            rust:
              - 'crates/**'
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.clippy.toml'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CHANGELOG.md'
              - '.markdownlint*'
            quality:
              - 'deny.toml'
              - '.cargo/**'
              - 'tools/scripts/**'
              - 'taskfiles/**'
              - 'Taskfile.yml'
              - '.agents/AGENTS.md'
            release:
              - '.github/workflows/release.yml'
              - '.github/workflows/tauri-build.yml'
              - 'src-tauri/tauri.conf.json'
              - 'src-tauri/capabilities/**'
              - 'src-tauri/permissions/**'
              - 'src-tauri/icons/**'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
            global:
              - 'Taskfile.yml'
              - '.editorconfig'
              - '.prettier*'
              - '.eslint*'

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap frontend checks
        uses: ./.github/actions/bootstrap
        with:
          node: 'true'
          playwright: 'true'

      - name: Run frontend checks
        run: task check:frontend

      - name: Run frontend quality checks
        run: task check:quality:frontend

      - name: Run Storybook build check
        run: task frontend:storybook

  rust:
    name: Rust
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Rust checks
        uses: ./.github/actions/bootstrap
        with:
          rust: 'true'

      - name: Run rust checks
        run: task check:rust

  docs:
    name: Docs
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.global == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap documentation checks
        uses: ./.github/actions/bootstrap
        with:
          node: 'true'

      - name: Run docs checks
        run: task check:docs

      - name: Run docs quality checks
        run: task check:quality:docs

  quality-global:
    name: Global Quality
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.global == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap quality checks
        uses: ./.github/actions/bootstrap
        with:
          node: 'true'

      - name: Run global quality checks
        run: task check:quality:global

  security:
    name: Dependency Security
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.quality == 'true' || needs.changes.outputs.release == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.global == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap security checks
        uses: ./.github/actions/bootstrap
        with:
          node: 'true'
          security: 'true'

      - name: Run security checks
        run: task check:quality:security

  release-checks:
    name: Release Check Parity
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.quality == 'true' || needs.changes.outputs.global == 'true' }}
    uses: ./.github/workflows/full-checks.yml

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - changes
      - frontend
      - rust
      - docs
      - quality-global
      - security
      - release-checks
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "CI Failed: One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "CI Passed: All required jobs passed or were properly skipped"
