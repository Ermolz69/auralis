name: Tauri Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap desktop build
        uses: ./.github/actions/bootstrap
        with:
          node: 'true'
          rust: 'true'

      - name: Prepare verified media tools
        run: task media:prepare

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1

      - name: Verify bundled media tools
        run: task media:bundle:verify

      - name: Install and launch packaged application
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: task release:smoke:install-launch
