name: Production Release

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Full Checks
    uses: ./.github/workflows/full-checks.yml

  release:
    name: Build & Release ${{ matrix.platform }}
    needs: check
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap desktop build
        uses: ./.github/actions/bootstrap
        with:
          node: 'true'
          rust: 'true'

      # ==========================================
      # OS CODE SIGNING PLACEHOLDERS
      # ==========================================

      # - name: Setup Windows Certs
      #   if: matrix.platform == 'windows-latest'
      #   run: echo "Import WINDOWS_CERTIFICATE here"

      # - name: Setup macOS Certs
      #   if: matrix.platform == 'macos-latest'
      #   run: echo "Import APPLE_CERTIFICATE and keychain here"

      # ==========================================
      # TAURI BUILD & RELEASE
      # ==========================================

      - name: Build Tauri app & Draft Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI UPDATER SIGNING PLACEHOLDERS
          # TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Auralis ${{ github.ref_name }}'
          releaseBody: 'Draft release for Auralis. See assets for installers.'
          releaseDraft: true
          prerelease: false
