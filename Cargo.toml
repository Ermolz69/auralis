[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/app-shell",
  "crates/application",
  "crates/domain",
  "crates/ports",
  "crates/adapters-tauri",
  "crates/adapters-storage",
  "crates/adapters-ytdlp",
  "crates/adapters-ffmpeg",
  "crates/adapters-model",
  "crates/jobs",
  "crates/common",
  "tools/glib-backport/regression"
]
exclude = ["vendor/glib-0.18.5"]

[workspace.dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }

[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
