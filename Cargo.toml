[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/application",
  "crates/domain",
  "crates/ports",
  "crates/adapters-tauri",
  "crates/adapters-storage",
  "crates/adapters-ytdlp",
  "crates/adapters-ffmpeg",
  "crates/adapters-model",
  "crates/jobs",
  "crates/common",
  "tools/glib-backport/regression"
]
exclude = ["vendor/glib-0.18.5"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Auralis Contributors"]

[workspace.dependencies]
async-trait = "0.1.89"
chrono = "0.4.45"
futures = "0.3.32"
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tauri = "2.11.5"
tauri-plugin-shell = "2.3.5"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.23.4"

[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
