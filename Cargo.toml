[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/application",
  "crates/domain",
  "crates/ports",
  "crates/adapters-tauri",
  "crates/adapters-storage",
  "crates/adapters-ytdlp",
  "crates/adapters-ffmpeg",
  "crates/adapters-model",
  "crates/jobs",
  "crates/common",
  "tools/glib-backport/regression"
]
exclude = ["vendor/glib-0.18.5"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Auralis Contributors"]

[workspace.dependencies]
adapters-ffmpeg = { path = "crates/adapters-ffmpeg" }
adapters-model = { path = "crates/adapters-model" }
adapters-storage = { path = "crates/adapters-storage" }
adapters-tauri = { path = "crates/adapters-tauri" }
adapters-ytdlp = { path = "crates/adapters-ytdlp" }
application = { path = "crates/application" }
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = "0.4.45"
common = { path = "crates/common" }
domain = { path = "crates/domain" }
filetime = "0.2.29"
futures = "0.3.32"
jobs = { path = "crates/jobs" }
ports = { path = "crates/ports" }
process-wrap = { version = "10.0.0", default-features = false }
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
sqlx-sqlite = { version = "0.9.0", default-features = false }
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-process = "=2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "=2.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.4"
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.23.4"
windows = { version = "0.62.2", default-features = false }

[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
