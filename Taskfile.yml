version: '3'

includes:
  fe:
    taskfile: ./taskfiles/frontend.yml
    aliases: [frontend]
  rs:
    taskfile: ./taskfiles/rust.yml
    aliases: [rust]
  q:
    taskfile: ./taskfiles/quality.yml
    aliases: [quality]
  docs:
    taskfile: ./taskfiles/docs.yml
  sec:
    taskfile: ./taskfiles/security.yml
    aliases: [security]
  media:
    taskfile: ./taskfiles/media.yml
  release:
    taskfile: ./taskfiles/release.yml

tasks:
  perf:translation-observer:measure:
    desc: Measure translation screen IPC calls and committed-progress DOM latency with fixed fixture IPC
    env:
      AURALIS_TRANSLATION_OBSERVER_REPORT: '{{default "target/translation-observer/latest.json" .REPORT}}'
    cmds:
      - pnpm --filter desktop exec vitest run --project component src/app/tests/translationObserverMeasure.test.tsx --reporter=default

  check:translation-observer:
    desc: Check translation observer, publication, typed IPC and two-database behavior
    cmds:
      - pnpm --filter desktop exec vitest run --project unit --project component src/entities/translation src/features/translation-run-control src/features/translation-review/ui/TranslationPublicationNotice.test.tsx src/shared/api/contracts/runtimeValidation.test.ts src/shared/api/contracts/translationHistoricalValidation.test.ts src/shared/api/contracts/translationProjectSnapshotValidation.test.ts --reporter=default
      - task: rs:test:translate
      - task: rs:test:application
      - task: rs:test:storage
      - task: rs:test:desktop
      - task: rs:test:translation-events
  setup:marker:local:
    desc: Verify the frozen Normalizer package and configure its model-free local preparation
    cmds:
      - node tools/tts/setup_marker.mjs {{.CLI_ARGS}}
  desktop:build:local:
    desc: Build the local Windows application without an installer or native test runner
    cmds:
      - pnpm tauri build --no-bundle --debug
  tts:native:inspect:
    requires:
      vars: [DATA_ROOT]
    cmds:
      - node tools/tts/inspect_native.mjs "{{.DATA_ROOT}}" {{.CLI_ARGS}}
  tts:native:verify:
    requires:
      vars: [DATA_ROOT, EXPECTED_RUNS]
    cmds:
      - node tools/tts/verify_native.mjs "{{.DATA_ROOT}}" "{{.EXPECTED_RUNS}}"
  tts:test:admission:
    desc: Verify competing model leases are refused without loading a model
    cmds:
      - powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/tts/test_admission.ps1
  tts:test:admission:metadata:
    desc: Verify model-free preparation shares model exclusion without claiming GPU memory
    cmds:
      - powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/tts/test_admission.ps1 -ModelFree
  desktop:e2e:native:speech:
    desc: Sequential real Windows speech acceptance with qualified installed voices and local GPU models
    env:
      AURALIS_NATIVE_E2E_SPEECH: '1'
      AURALIS_NATIVE_E2E_TRANSLATION: '0'
      AURALIS_NATIVE_E2E_CASTER: '0'
      AURALIS_NATIVE_E2E_KEEP_TEMP: '1'
    cmds:
      - node --check tools/native-e2e/speech.mjs
      - node tools/native-e2e/run.mjs
  desktop:e2e:native:speech:resume:
    desc: Explicitly continue cancellation and crash acceptance from a retained completed matrix
    requires:
      vars: [SANDBOX]
    env:
      AURALIS_NATIVE_E2E_SPEECH_RECOVERY_ROOT: '{{.SANDBOX}}'
      AURALIS_NATIVE_E2E_SPEECH: '1'
      AURALIS_NATIVE_E2E_TRANSLATION: '0'
      AURALIS_NATIVE_E2E_CASTER: '0'
      AURALIS_NATIVE_E2E_KEEP_TEMP: '1'
    cmds:
      - node --check tools/native-e2e/speech.mjs
      - node tools/native-e2e/run.mjs
  tts:qualification:prepare:
    desc: Verify the eight new voices on both engines and retain unscored reports
    cmds:
      - task -d ../TTS voices:new:review
  tts:qualification:apply:
    desc: Record explicit human decisions for the new voices through CONTRACT
    requires:
      vars: [CLI_ARGS]
    cmds:
      - task -d ../TTS voices:new:apply -- {{.CLI_ARGS}}
  setup:tts:local:
    desc: Install pinned local PUZA wheels, voice copies and runtime configuration without model loading
    vars:
      PYTHON: '{{default "../TTS/PUZA_TTS/.venv_gpu/Scripts/python.exe" .PYTHON}}'
    cmds:
      - '"{{.PYTHON}}" tools/tts/setup_local.py {{.CLI_ARGS}}'

  tts:bundle:stage:
    desc: Stage a hashed standalone PUZA runtime, model, wheel, and voice bundle from the verified local installation
    requires:
      vars: [BUNDLE]
    vars:
      PYTHON: '{{default "../TTS/PUZA_TTS/.venv_gpu/Scripts/python.exe" .PYTHON}}'
    cmds:
      - '"{{.PYTHON}}" tools/tts/local_bundle.py stage --bundle "{{.BUNDLE}}"'

  tts:bundle:install:
    desc: Install a standalone PUZA bundle using its own Python without any source checkout
    requires:
      vars: [BUNDLE, DATA_ROOT]
    cmds:
      - 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{{.BUNDLE}}/install.ps1" -DataRoot "{{.DATA_ROOT}}"'

  tts:bundle:probe:
    desc: Run one technical model probe from a standalone bundle under shared admission
    requires:
      vars: [DATA_ROOT, CASE]
    cmds:
      - 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/tts/run_bundle_probe.ps1 -DataRoot "{{.DATA_ROOT}}" -CaseId "{{.CASE}}"'

  tts:bundle:verify:
    desc: Compare four standalone model WAVs with frozen source hashes and retain evidence
    requires:
      vars: [BUNDLE, DATA_ROOT]
    vars:
      PYTHON: '{{default "../TTS/PUZA_TTS/.venv_gpu/Scripts/python.exe" .PYTHON}}'
    cmds:
      - '"{{.PYTHON}}" tools/tts/export_bundle_evidence.py --bundle "{{.BUNDLE}}" --data-root "{{.DATA_ROOT}}"'

  setup:media-tools:
    desc: Alias for media:setup-tools
    cmds:
      - task: media:setup-tools

  install:
    desc: Alias for install:all
    cmds:
      - task: install:all

  install:frontend:
    desc: Install frontend and documentation dependencies without Rust
    cmds:
      - task: fe:install

  install:rust:
    desc: Fetch locked Rust dependencies without frontend tooling
    cmds:
      - task: rs:fetch

  install:all:
    desc: Install frontend and Rust dependencies without browser setup
    cmds:
      - task: install:frontend
      - task: install:rust

  dev:
    desc: Start the frontend development server only
    cmds:
      - pnpm --filter desktop dev

  desktop:dev:
    desc: Start the complete Tauri desktop application locally
    cmds:
      - pnpm tauri dev

  desktop:before-dev:
    desc: Prepare native media tools, then run the desktop development server
    cmds:
      - task: media:prepare
      - task: fe:dev

  desktop:before-build:
    desc: Prepare native media tools, then build the desktop frontend
    cmds:
      - task: media:prepare
      - task: fe:build

  desktop:bundle:
    desc: Build native installers with verified bundled media tools
    cmds:
      - pnpm tauri build {{.CLI_ARGS}}
      - task: media:bundle:verify

  desktop:bundle:from-build:
    desc: Package the current release executable and verify its payload without recompiling
    cmds:
      - task: media:verify
      - pnpm tauri bundle {{.CLI_ARGS}}
      - task: media:bundle:verify

  desktop:before-bundle:
    desc: Capture the current Windows application identity before package patching and signing
    cmds:
      - node tools/release/prepare-bundled-application.mjs

  desktop:e2e:native:
    desc: Run real React-to-IPC-to-Rust-to-SQLite-to-ffprobe/yt-dlp/filesystem acceptance
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:caster:
    desc: Exercise installed Caster through native catalog controls, typed IPC, audio and managed cast restart
    requires:
      vars: [PYTHON, VOICE_STORE]
    env:
      AURALIS_NATIVE_E2E_CASTER: '1'
      AURALIS_TEST_CASTER_PYTHON: '{{.PYTHON}}'
      AURALIS_TEST_CASTER_VOICE_STORE: '{{.VOICE_STORE}}'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:
    desc: Run native Tauri translation acceptance with an installed checked llama.cpp model
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:events:
    desc: Verify checked-model translation events and actual panel publication refresh
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_EVENTS: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:history:
    desc: Branch an older two-cue checked-model result, verify inherited text and historical selection, then reopen it
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:history:export:
    desc: Export two historical SRT results through native IPC, then retry and re-export after desktop restart
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY_EXPORT: '1'
    cmds:
      - task: desktop:e2e:native:translation:history:export:check
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:history:export:vtt:
    desc: Export two historical strict WebVTT results through native IPC and retry after restart
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_VTT: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY_EXPORT: '1'
    cmds:
      - task: desktop:e2e:native:translation:history:export:check
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:history:export:check:
    desc: Check the native history export harness before model admission
    cmds:
      - node --check tools/native-e2e/run.mjs
      - node --check tools/native-e2e/translation-history.mjs
      - node --check tools/native-e2e/translation-history-exports.mjs
      - node --check tools/native-e2e/translation-history-results.mjs
      - node --test tools/native-e2e/translation-history-exports.test.mjs tools/native-e2e/translation-history-results.test.mjs

  desktop:e2e:native:translation:history:result-gap:
    desc: Kill after an older-base edit commits, then recover its output without overriding a newer UI choice
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY_GAP: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:history:journal-gap:
    desc: Kill after manual intent admission, verify startup creates no result, then replay the exact request
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY_GAP: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_HISTORY_JOURNAL_GAP: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:inspect-history:
    desc: Read publication and outbox diagnostics from an isolated native test data root
    requires:
      vars: [DATA_ROOT]
    cmds:
      - node tools/native-e2e/inspect-history.mjs "{{.DATA_ROOT}}"

  desktop:e2e:native:translation:package:
    desc: Install and select the pinned CPU package in native React, restart Auralis, and translate a subtitle
    requires:
      vars: [ASSET_DIR]
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PACKAGE: '1'
      AURALIS_TEST_PACKAGE_ASSET_DIR: '{{.ASSET_DIR}}'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:pause:
    desc: Pause a checked-model native job, verify both databases and child release, then resume in the same desktop
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PAUSE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:vtt:
    desc: Run native Tauri strict-WebVTT translation acceptance with an installed checked llama.cpp model
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_VTT: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:preparation-pause:
    desc: Pause native preparation, verify zero attempts and child release, then restore worker preflight controls and resume
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PREPARATION_PAUSE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:worker-preflight-pause:
    desc: Pause native admission and accepted worker preflight, verify cleanup before attempt creation, then resume
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PREPARATION_PAUSE: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_WORKER_PREFLIGHT_PAUSE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:initial-hash-pause:
    desc: Pause native preparation during an observed incomplete real model hash, verify zero admitted records, then freshly verify and resume
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PREPARATION_PAUSE: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_INITIAL_HASH_PAUSE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:preparation:check:
    desc: Verify native preparation boundaries reject partial work, missing counts, stale identity and invalid host ownership
    cmds:
      - node --test tools/native-e2e/preparation-snapshot.test.mjs tools/native-e2e/worker-preflight-snapshot.test.mjs tools/native-e2e/hash-observation.test.mjs tools/native-e2e/start-race-observation.test.mjs

  desktop:e2e:native:translation:start-race:
    desc: Verify parallel native starts are busy during initial hashing and reuse one accepted worker, retaining pause and fresh resume
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PREPARATION_PAUSE: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_INITIAL_HASH_PAUSE: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_START_RACE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:vtt:pause:
    desc: Pause and resume native strict-WebVTT translation with a checked model and exact checkpoint retention
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_VTT: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PAUSE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:vtt:crash:
    desc: Kill and restart native strict-WebVTT translation after one checked-model checkpoint
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_VTT: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_CRASH: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:crash:
    desc: Kill and restart native Tauri translation after one durable checked-model checkpoint
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_CRASH: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:result-gap:
    desc: Kill native Tauri after Translate result commit, then recover the missing Auralis publication
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_CRASH: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_RESULT_GAP: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:delete:
    desc: Delete a native translation project during a checked-model attempt
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_DELETE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:single-owner:
    desc: Reject a second native Tauri process targeting the first process's data root
    env:
      AURALIS_NATIVE_E2E_SECOND_OWNER: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  check:frontend:
    desc: Run the complete frontend test, browser, build, and architecture gate
    cmds:
      - task: fe:all
      - task: q:frontend

  check:rust:
    cmds:
      - task: rs:all

  check:jobs:
    desc: Run focused job lifecycle and cancellation checks
    cmds:
      - task: rs:test:jobs
      - task: rs:test:queue
      - task: fe:test:jobs

  check:integration:contract:
    desc: Verify typed speech boundaries and synthetic model-free adapter checks
    cmds:
      - task: rs:test:ports
      - task: rs:test:contract-adapter
      - task: rs:test:model-admission

  check:rust:pr:
    desc: Run the Rust gates required for pull requests without release-only regressions
    cmds:
      - task: rs:pr

  check:docs:
    cmds:
      - task: docs:all

  check:quality:frontend:
    cmds:
      - task: q:frontend

  check:storybook:
    desc: Validate the complete Storybook design-system catalog
    cmds:
      - task: fe:storybook:check

  check:colors:
    cmds:
      - task: q:color-tokens

  check:quality:docs:
    cmds:
      - task: q:docs

  check:quality:security:
    cmds:
      - task: sec:audit

  check:quality:runtime-println:
    cmds:
      - task: q:runtime-println

  check:quality:global:
    cmds:
      - task: q:global

  check:pr:
    desc: Run every pull-request gate locally before pushing
    cmds:
      - task: check:frontend
      - task: check:rust:pr
      - task: check:docs
      - task: check:quality:docs
      - task: check:quality:security
      - task: check:quality:global

  check:all:
    cmds:
      - task: check:pr
      - task: rs:glib:regression

  check:
    desc: Run all checks
    cmds:
      - task: check:all

  ci:
    desc: Install dependencies and reproduce all pull-request checks locally
    cmds:
      - task: install:all
      - task: check:pr
