version: '3'

includes:
  fe:
    taskfile: ./taskfiles/frontend.yml
    aliases: [frontend]
  rs:
    taskfile: ./taskfiles/rust.yml
    aliases: [rust]
  q:
    taskfile: ./taskfiles/quality.yml
    aliases: [quality]
  docs:
    taskfile: ./taskfiles/docs.yml
  sec:
    taskfile: ./taskfiles/security.yml
    aliases: [security]
  media:
    taskfile: ./taskfiles/media.yml
  release:
    taskfile: ./taskfiles/release.yml

tasks:
  setup:media-tools:
    desc: Alias for media:setup-tools
    cmds:
      - task: media:setup-tools

  install:
    desc: Alias for install:all
    cmds:
      - task: install:all

  install:frontend:
    desc: Install frontend and documentation dependencies without Rust
    cmds:
      - task: fe:install

  install:rust:
    desc: Fetch locked Rust dependencies without frontend tooling
    cmds:
      - task: rs:fetch

  install:all:
    desc: Install frontend and Rust dependencies without browser setup
    cmds:
      - task: install:frontend
      - task: install:rust

  dev:
    desc: Start the frontend development server only
    cmds:
      - pnpm --filter desktop dev

  desktop:dev:
    desc: Start the complete Tauri desktop application locally
    cmds:
      - pnpm tauri dev

  desktop:before-dev:
    desc: Prepare native media tools, then run the desktop development server
    cmds:
      - task: media:prepare
      - task: fe:dev

  desktop:before-build:
    desc: Prepare native media tools, then build the desktop frontend
    cmds:
      - task: media:prepare
      - task: fe:build

  desktop:bundle:
    desc: Build native installers with verified bundled media tools
    cmds:
      - pnpm tauri build {{.CLI_ARGS}}
      - task: media:bundle:verify

  desktop:bundle:from-build:
    desc: Package the current release executable and verify its payload without recompiling
    cmds:
      - task: media:verify
      - pnpm tauri bundle {{.CLI_ARGS}}
      - task: media:bundle:verify

  desktop:before-bundle:
    desc: Capture the current Windows application identity before package patching and signing
    cmds:
      - node tools/release/prepare-bundled-application.mjs

  desktop:e2e:native:
    desc: Run real React-to-IPC-to-Rust-to-SQLite-to-ffprobe/yt-dlp/filesystem acceptance
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:
    desc: Run native Tauri translation acceptance with an installed checked llama.cpp model
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:package:
    desc: Install and select the pinned CPU package in native React, restart Auralis, and translate a subtitle
    requires:
      vars: [ASSET_DIR]
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PACKAGE: '1'
      AURALIS_TEST_PACKAGE_ASSET_DIR: '{{.ASSET_DIR}}'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:pause:
    desc: Pause a checked-model native job, verify both databases and child release, then resume in the same desktop
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PAUSE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:vtt:
    desc: Run native Tauri strict-WebVTT translation acceptance with an installed checked llama.cpp model
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_VTT: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:vtt:pause:
    desc: Pause and resume native strict-WebVTT translation with a checked model and exact checkpoint retention
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_VTT: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_PAUSE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:vtt:crash:
    desc: Kill and restart native strict-WebVTT translation after one checked-model checkpoint
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_VTT: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_CRASH: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:crash:
    desc: Kill and restart native Tauri translation after one durable checked-model checkpoint
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_CRASH: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:result-gap:
    desc: Kill native Tauri after Translate result commit, then recover the missing Auralis publication
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_CRASH: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_RESULT_GAP: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:translation:delete:
    desc: Delete a native translation project during a checked-model attempt
    env:
      AURALIS_NATIVE_E2E_TRANSLATION: '1'
      AURALIS_NATIVE_E2E_TRANSLATION_DELETE: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  desktop:e2e:native:single-owner:
    desc: Reject a second native Tauri process targeting the first process's data root
    env:
      AURALIS_NATIVE_E2E_SECOND_OWNER: '1'
    cmds:
      - node tools/native-e2e/run.mjs

  check:frontend:
    desc: Run the complete frontend test, browser, build, and architecture gate
    cmds:
      - task: fe:all
      - task: q:frontend

  check:rust:
    cmds:
      - task: rs:all

  check:jobs:
    desc: Run focused job lifecycle and cancellation checks
    cmds:
      - task: rs:test:jobs
      - task: fe:test:jobs

  check:rust:pr:
    desc: Run the Rust gates required for pull requests without release-only regressions
    cmds:
      - task: rs:pr

  check:docs:
    cmds:
      - task: docs:all

  check:quality:frontend:
    cmds:
      - task: q:frontend

  check:storybook:
    desc: Validate the complete Storybook design-system catalog
    cmds:
      - task: fe:storybook:check

  check:colors:
    cmds:
      - task: q:color-tokens

  check:quality:docs:
    cmds:
      - task: q:docs

  check:quality:security:
    cmds:
      - task: sec:audit

  check:quality:runtime-println:
    cmds:
      - task: q:runtime-println

  check:quality:global:
    cmds:
      - task: q:global

  check:pr:
    desc: Run every pull-request gate locally before pushing
    cmds:
      - task: check:frontend
      - task: check:rust:pr
      - task: check:docs
      - task: check:quality:docs
      - task: check:quality:security
      - task: check:quality:global

  check:all:
    cmds:
      - task: check:pr
      - task: rs:glib:regression

  check:
    desc: Run all checks
    cmds:
      - task: check:all

  ci:
    desc: Install dependencies and reproduce all pull-request checks locally
    cmds:
      - task: install:all
      - task: check:pr
